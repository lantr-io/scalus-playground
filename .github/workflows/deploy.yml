name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      # Only the UI is deployed (~0.5 MB). The toolchain is served from lantr-io/scalus-scala3-wasm's Pages site,
      # in the version TOOLCHAIN_VERSION names.
      - name: Build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: |
          export VITE_TOOLCHAIN_URL="https://lantr.io/scalus-scala3-wasm/toolchain/$(cat TOOLCHAIN_VERSION)/browser-ide/"
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
